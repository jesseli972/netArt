<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Screensaver</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0c1a2e;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      cursor: default;
    }

    .prompt {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 1;
      transition: opacity 1s ease-out;
      pointer-events: none;
    }

    .prompt h1 {
      font-size: 3rem;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.3em;
    }

    .prompt p {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.15em;
      margin-top: 0.5rem;
      animation: blink 2.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }

    /* Fade out prompt on hover */
    body:hover .prompt {
      opacity: 0;
    }

    /* === NET — stays in the middle === */
    .net {
      position: absolute;
      top: 50%;
      left: 5%;
      right: 5%;
      height: 60px;
      border-top: 3px solid rgba(255, 255, 255, 0.6);
      opacity: 0;
      transition: opacity 1.5s ease;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.12) 0px,
          rgba(255, 255, 255, 0.12) 1px,
          transparent 1px,
          transparent 25px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.08) 0px,
          rgba(255, 255, 255, 0.08) 1px,
          transparent 1px,
          transparent 15px
        );
    }

    body:hover .net {
      opacity: 1;
    }

    /* SHARED SHAPE STYLES */
    .ball {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff 0%, #e8e0d0 100%);
      box-shadow:
        inset -3px -3px 8px rgba(0, 0, 0, 0.15),
        0 0 20px rgba(255, 255, 255, 0.1);
      opacity: 0;
      transition: opacity 1.2s ease;
      /* Paused until hover */
      animation-play-state: paused;
    }

    body:hover .ball {
      opacity: 1;
      animation-play-state: running;
    }

    /* BALL 1 — large, arcs like a serve*/
    .ball-1 {
      width: 80px;
      height: 80px;
      top: 30%;
      left: 10%;
      animation:
        arc-1 8s ease-in-out infinite,
        spin 4s linear infinite;
    }

    @keyframes arc-1 {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(25vw, -25vh); }
      50%  { transform: translate(55vw, 5vh); }
      75%  { transform: translate(30vw, -20vh); }
      100% { transform: translate(0, 0); }
    }

    @keyframes spin {
      to { rotate: 360deg; }
    }

    /* BALL 2 — medium, different path */
    .ball-2 {
      width: 50px;
      height: 50px;
      top: 65%;
      right: 15%;
      animation:
        arc-2 11s ease-in-out infinite,
        spin 6s linear infinite reverse;
    }

    @keyframes arc-2 {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-30vw, -35vh); }
      50%  { transform: translate(-55vw, -5vh); }
      75%  { transform: translate(-20vw, -25vh); }
      100% { transform: translate(0, 0); }
    }

    /* BALL 3 — small */
    .ball-3 {
      width: 30px;
      height: 30px;
      top: 20%;
      right: 30%;
      animation:
        arc-3 14s ease-in-out infinite,
        spin 8s linear infinite;
    }

    @keyframes arc-3 {
      0%   { transform: translate(0, 0); }
      33%  { transform: translate(15vw, 40vh); }
      66%  { transform: translate(-20vw, 20vh); }
      100% { transform: translate(0, 0); }
    }

    /* SCORE TEXT — drifts across screen */
    .score {
      position: absolute;
      top: 15%;
      left: 55%;
      font-size: 3.5rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(61, 160, 217, 0.3);
      opacity: 0;
      transition: opacity 1.5s ease;
      animation: drift 20s linear infinite paused;
    }

    body:hover .score {
      opacity: 1;
      animation-play-state: running;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-30vw, 25vh); }
      50%  { transform: translate(-15vw, 55vh); }
      75%  { transform: translate(-35vw, 20vh); }
      100% { transform: translate(0, 0); }
    }

    /* COURT OUTLINE — floating rectangle */
    .court {
      position: absolute;
      bottom: 15%;
      left: 8%;
      width: 160px;
      height: 100px;
      border: 2px solid rgba(255, 107, 43, 0.25);
      opacity: 0;
      transition: opacity 1.5s ease;
      animation: court-move 18s linear infinite paused;
    }

    /* Center line via pseudo-element */
    .court::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background: rgba(255, 107, 43, 0.2);
    }

    body:hover .court {
      opacity: 1;
      animation-play-state: running;
    }

    @keyframes court-move {
      0%   { transform: translate(0, 0) rotate(0deg); }
      50%  { transform: translate(50vw, -30vh) rotate(5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* active STATE — hold click for turbo */
    body:active .ball-1 { animation-duration: 3s, 1.5s; }
    body:active .ball-2 { animation-duration: 4s, 2s; }
    body:active .ball-3 { animation-duration: 5s, 2.5s; }
    body:active .score   { animation-duration: 7s; }
    body:active .court   { animation-duration: 6s; }

    /* :nth-of-type — unique glow per corner */
    .corner {
      position: fixed;
      width: 40px;
      height: 40px;
      border-color: rgba(255, 255, 255, 0.05);
      border-style: solid;
      border-width: 0;
      opacity: 0;
      transition: opacity 1.5s ease, border-color 0.4s ease;
    }

    body:hover .corner { opacity: 1; }

    .corner:nth-of-type(1) { top: 12px; left: 12px; border-top-width: 2px; border-left-width: 2px; }
    .corner:nth-of-type(2) { top: 12px; right: 12px; border-top-width: 2px; border-right-width: 2px; }
    .corner:nth-of-type(3) { bottom: 12px; left: 12px; border-bottom-width: 2px; border-left-width: 2px; }
    .corner:nth-of-type(4) { bottom: 12px; right: 12px; border-bottom-width: 2px; border-right-width: 2px; }

    .corner:nth-of-type(1):hover { border-color: #3da0d9; }
    .corner:nth-of-type(2):hover { border-color: #ff6b2b; }
    .corner:nth-of-type(3):hover { border-color: #f5deb3; }
    .corner:nth-of-type(4):hover { border-color: #e74c3c; }
  </style>
</head>
<body>

  <!-- Prompt text -->
  <div class="prompt">
    <h1>Game Point</h1>
    <p>Hover to serve · Hold click for rally mode</p>
  </div>

  <!-- Corner brackets -->
  <div class="corner"></div>
  <div class="corner"></div>
  <div class="corner"></div>
  <div class="corner"></div>

  <!-- Net -->
  <div class="net"></div>

  <!-- Volleyballs -->
  <div class="ball ball-1"></div>
  <div class="ball ball-2"></div>
  <div class="ball ball-3"></div>

  <!-- Floating score -->
  <div class="score">25 – 23</div>

  <!-- Court outline -->
  <div class="court"></div>

</body>
</html>
